name = "my-backend-worker"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MY_BACKEND"
class_name = "MyBackendContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MyBackendContainer"]

[[containers]]
name = "my_backend"
class_name = "MyBackendContainer"
image = "../Resume_Screener_Backend/Dockerfile"

[vars]
NODE_ENV = "production"